services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - voiceprints:/app/.voiceprints-data
    environment:
      VOICEPRINT_DB: /app/.voiceprints-data/.voiceprints.json
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        # Must be reachable from the USER'S BROWSER, e.g. http://<server-ip>:8000
        # or a public domain — not "http://backend:8000" (that only resolves
        # inside the Docker network, not on the client's machine).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  voiceprints:
